name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

  test-ubuntu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify configs
        run: |
          node --version
          npm --version
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json ok')"

      - name: Compile Python files
        run: python -m compileall -q starbridge_mcp scripts examples tests

      - name: Run Python tests
        run: python -m unittest discover -s tests

      - name: Run safe bridge checks
        run: |
          python scripts/security_check.py
          python scripts/check_product_facts.py
          python scripts/check_text_encoding.py
          python scripts/collect_bridge_status.py --json
          python examples/bridge_status.py --json --redact-paths --soft-exit
          python -m starbridge_mcp.server tools --json --safe-only
          python -m starbridge_mcp.server evidence --init --json
          python -m starbridge_mcp.server evidence --validate --json
          python -m starbridge_mcp.server job-status --json

      - name: Run KORYAO preflight
        run: python scripts/starbridge_preflight.py --markdown

      - name: Run npm scripts
        run: npm test

  test-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Python dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run security check (Windows)
        run: |
          python scripts/security_check.py
          python scripts/check_product_facts.py
          python scripts/check_text_encoding.py

      - name: Run preflight
        run: python scripts/starbridge_preflight.py --markdown

      - name: Run basic Python tests
        run: python -m unittest discover -s tests

      - name: Verify npm
        run: npm.cmd test

  test-desktop-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/starbridge-desktop/package-lock.json

      - name: Install desktop dependencies from lockfile
        run: npm ci --prefix apps/starbridge-desktop

      - name: Test desktop frontend
        run: npm test --prefix apps/starbridge-desktop

      - name: Build desktop frontend
        run: npm run build --prefix apps/starbridge-desktop

  test-vector60-runtime:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned Vector60 runtimes
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vector60]"
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Vector60 Python versions
        run: >-
          python -c "import importlib.metadata as m; import pathops, svgpathtools, vtracer;
          expected={'vtracer':'0.6.15','skia-pathops':'0.9.2','svgpathtools':'1.7.2'};
          actual={name:m.version(name) for name in expected}; assert actual == expected, (expected, actual);
          print(actual)"

      - name: Verify locked SVGO CLI
        shell: pwsh
        run: |
          $svgo = if ($IsWindows) { ".\node_modules\.bin\svgo.cmd" } else { "./node_modules/.bin/svgo" }
          $version = (& $svgo --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "4.0.2") {
            throw "Expected SVGO 4.0.2 from the lockfile, got '$version'."
          }

  test-desktop-rust:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/starbridge-desktop/src-tauri/Cargo.toml --all -- --check

      - name: Prepare Tauri test resources
        shell: pwsh
        run: |
          $sidecarDir = "apps/starbridge-desktop/src-tauri/binaries"
          New-Item -ItemType Directory -Force -Path "$sidecarDir/_internal" | Out-Null
          New-Item -ItemType File -Force -Path "$sidecarDir/_internal/.ci-placeholder" | Out-Null
          New-Item -ItemType File -Force -Path "$sidecarDir/starbridge-sidecar-x86_64-pc-windows-msvc.exe" | Out-Null

      - name: Test Tauri shell
        run: cargo test --manifest-path apps/starbridge-desktop/src-tauri/Cargo.toml

  test-macos-python-sidecar:
    name: macOS 15 arm64 Python and real sidecar producer
    runs-on: macos-15
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create controlled repository Python environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Compile Python files
        run: .venv/bin/python -m compileall -q starbridge_mcp scripts examples tests

      - name: Run complete Python test suite
        run: .venv/bin/python -m unittest discover -s tests

      - name: Run safe bridge checks
        run: |
          .venv/bin/python scripts/security_check.py
          .venv/bin/python scripts/check_product_facts.py
          .venv/bin/python scripts/check_text_encoding.py
          .venv/bin/python scripts/collect_bridge_status.py --json
          .venv/bin/python examples/bridge_status.py --json --redact-paths --soft-exit
          .venv/bin/python -m starbridge_mcp.server tools --json --safe-only
          .venv/bin/python -m starbridge_mcp.server evidence --init --json
          .venv/bin/python -m starbridge_mcp.server evidence --validate --json
          .venv/bin/python -m starbridge_mcp.server job-status --json

      - name: Run KORYAO preflight
        run: .venv/bin/python scripts/starbridge_preflight.py --markdown

      - name: Build and verify real arm64 Darwin sidecar
        run: |
          set -euo pipefail
          target="aarch64-apple-darwin"
          binaries="apps/starbridge-desktop/src-tauri/binaries"
          sidecar="$binaries/starbridge-sidecar-$target"
          support="$binaries/_internal-$target"

          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          ./apps/starbridge-desktop/scripts/Build-Sidecar.sh --target-triple "$target"
          ./apps/starbridge-desktop/scripts/Build-Sidecar.sh \
            --target-triple "$target" \
            --verify-staged

          test -x "$sidecar"
          test -d "$support"
          test -d "$support/cv2/.dylibs"
          test -d "$support/PIL/.dylibs"
          if find "$binaries" \( -name ".ci-placeholder" -o -name "*.exe" -o -name "_internal" \) \
            -print -quit | grep -q .; then
            echo "Placeholder or Windows sidecar payload found in the Darwin staging directory." >&2
            exit 1
          fi

          /usr/bin/file "$sidecar"
          test "$(/usr/bin/lipo -archs "$sidecar")" = "arm64"
          /usr/bin/otool -L "$sidecar"
          "$sidecar" --vector60-runtime-check

      - name: Pack sidecar as a symlink-preserving archive
        run: |
          set -euo pipefail
          target="aarch64-apple-darwin"
          binaries="apps/starbridge-desktop/src-tauri/binaries"
          archive="$binaries/starbridge-sidecar-$target.tar"
          .venv/bin/python -I apps/starbridge-desktop/scripts/sidecar_artifact.py pack \
            --target-triple "$target" \
            --binaries-root "$binaries" \
            --archive "$archive" \
            --digest "$archive.sha256" \
            --manifest "$archive.manifest.json"

      - name: Upload real arm64 Darwin sidecar archive
        uses: actions/upload-artifact@v7
        with:
          name: starbridge-sidecar-aarch64-apple-darwin
          path: |
            apps/starbridge-desktop/src-tauri/binaries/starbridge-sidecar-aarch64-apple-darwin.tar
            apps/starbridge-desktop/src-tauri/binaries/starbridge-sidecar-aarch64-apple-darwin.tar.sha256
            apps/starbridge-desktop/src-tauri/binaries/starbridge-sidecar-aarch64-apple-darwin.tar.manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  test-macos-tauri-app:
    name: macOS 15 arm64 sidecar consumer and real Tauri app
    needs: test-macos-python-sidecar
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Create controlled repository Python environment
        run: python -m venv .venv

      - name: Download real arm64 Darwin sidecar archive
        uses: actions/download-artifact@v8
        with:
          name: starbridge-sidecar-aarch64-apple-darwin
          path: apps/starbridge-desktop/src-tauri/binaries

      - name: Verify and safely extract sidecar archive
        run: |
          set -euo pipefail
          target="aarch64-apple-darwin"
          binaries="apps/starbridge-desktop/src-tauri/binaries"
          archive="$binaries/starbridge-sidecar-$target.tar"
          .venv/bin/python -I apps/starbridge-desktop/scripts/sidecar_artifact.py \
            verify-extract \
            --target-triple "$target" \
            --archive "$archive" \
            --digest "$archive.sha256" \
            --manifest "$archive.manifest.json" \
            --destination "$binaries"

      - name: Verify downloaded sidecar runtime
        run: |
          set -euo pipefail
          target="aarch64-apple-darwin"
          binaries="apps/starbridge-desktop/src-tauri/binaries"
          sidecar="$binaries/starbridge-sidecar-$target"
          support="$binaries/_internal-$target"

          test -x "$sidecar"
          test -d "$support"
          test -d "$support/cv2/.dylibs"
          test -d "$support/PIL/.dylibs"
          if find "$binaries" \( -name ".ci-placeholder" -o -name "*.exe" -o -name "_internal" \) \
            -print -quit | grep -q .; then
            echo "Placeholder or Windows sidecar payload found after artifact extraction." >&2
            exit 1
          fi

          /usr/bin/file "$sidecar"
          test "$(/usr/bin/lipo -archs "$sidecar")" = "arm64"
          /usr/bin/otool -L "$sidecar"
          ./apps/starbridge-desktop/scripts/Build-Sidecar.sh \
            --target-triple "$target" \
            --verify-staged
          "$sidecar" --vector60-runtime-check
          ./apps/starbridge-desktop/scripts/Test-Sidecar.sh \
            --target-triple "$target" \
            --skip-build

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/starbridge-desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install desktop dependencies from lockfile
        run: npm ci --prefix apps/starbridge-desktop

      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/starbridge-desktop/src-tauri/Cargo.toml --all -- --check

      - name: Test Tauri shell with the real Darwin sidecar
        run: cargo test --manifest-path apps/starbridge-desktop/src-tauri/Cargo.toml

      - name: Build real macOS app bundle
        working-directory: apps/starbridge-desktop
        run: npm run tauri -- build --bundles app

      - name: Verify app bundle sidecar resources
        run: |
          set -euo pipefail
          target="aarch64-apple-darwin"
          bundle_root="apps/starbridge-desktop/src-tauri/target/release/bundle/macos"
          source_root="apps/starbridge-desktop/src-tauri/binaries"
          app_count="$(find "$bundle_root" -maxdepth 1 -type d -name "*.app" | wc -l | tr -d ' ')"
          test "$app_count" = "1"
          app_bundle="$(find "$bundle_root" -maxdepth 1 -type d -name "*.app" -print -quit)"
          resources="$app_bundle/Contents/Resources"
          sidecar="$resources/starbridge-sidecar-$target"
          support="$resources/_internal-$target"

          test -x "$sidecar"
          test -d "$support"
          test -d "$support/cv2/.dylibs"
          test -d "$support/PIL/.dylibs"
          cmp -s "$source_root/starbridge-sidecar-$target" "$sidecar"
          if find "$resources" \( -name ".ci-placeholder" -o -name "*.exe" -o -name "_internal" \) \
            -print -quit | grep -q .; then
            echo "Placeholder or Windows sidecar payload found in the macOS app resources." >&2
            exit 1
          fi

          /usr/bin/file "$sidecar"
          test "$(/usr/bin/lipo -archs "$sidecar")" = "arm64"
          /usr/bin/otool -L "$sidecar"
          "$sidecar" --vector60-runtime-check

  test-illustrator-headless-trace:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      STARBRIDGE_REQUIRE_TRACE_RUNTIME: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install color trace test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,illustrator-trace,vectorization]"

      - name: Verify color trace runtime imports
        run: python -c "import cv2, numpy, PIL; print(cv2.__version__, numpy.__version__, PIL.__version__)"

      - name: Run real headless color raster to SVG closed-loop tests
        run: python -m unittest tests.test_illustrator_color_trace tests.test_vectorization_modes tests.test_smart_vector_refinement_skill

  test-image-to-psd-headless:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      STARBRIDGE_REQUIRE_IMAGE_TO_PSD_RUNTIME: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install image-to-PSD test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,image-to-psd]"

      - name: Verify image decomposition runtime imports
        run: python -c "import cv2, numpy, PIL; print(cv2.__version__, numpy.__version__, PIL.__version__)"

      - name: Run real headless image-to-layer-assets closed-loop tests
        run: >-
          python -m unittest
          tests.test_photoshop_semantic_layers
          tests.test_photoshop_github_feedback
          tests.test_photoshop_public_dataset
          tests.test_photoshop_public_experiment
          tests.test_photoshop_training

      - name: Run public cross-intent synthetic regression
        run: >-
          python -m starbridge_mcp.adapters.photoshop.semantic_layers.cli regression
          --output-root examples/output/photoshop/ci-synthetic-regression
          --confirm-write
